name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]   # 3.12 — как на сервере (Docker), 3.14 — как на Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (без публикации)
        run: docker build -t weather-bot:ci .
      - name: Import check on server Python
        run: docker run --rm -e DATA_DIR=/tmp weather-bot:ci python -c "import bot, sys; print('import ok', sys.version.split()[0])"
