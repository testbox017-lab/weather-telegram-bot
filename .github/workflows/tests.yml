name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # ручной запуск: тесты + деплой

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]   # 3.14 — как на сервере (Docker) и на Windows, 3.12 — для запуска без Docker (вариант B в DEPLOY.md)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (без публикации)
        run: docker build -t weather-bot:ci .
      - name: Import check on server Python
        run: docker run --rm -e DATA_DIR=/tmp weather-bot:ci python -c "import bot, sys; print('import ok', sys.version.split()[0])"

  deploy:
    # после зелёных тестов и сборки на main сервер обновляется сам
    needs: [pytest, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy to server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "Секреты DEPLOY_SSH_KEY / DEPLOY_HOST не заданы — деплой пропущен"; exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # ключ на сервере ограничен командой weather-bot-deploy, другой доступ им не получить
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes root@"$HOST" deploy
